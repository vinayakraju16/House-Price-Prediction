services:
  - type: web
    name: havenvalue-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: PORT
        value: "8000"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: havenvalue-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://house-price-prediction.vinayakraju01.workers.dev
      - key: CSRF_TRUSTED_ORIGINS
        value: https://house-price-prediction.vinayakraju01.workers.dev
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_COOKIES
        value: "true"
      - key: DJANGO_TRUST_PROXY_PROTO
        value: "true"
      - key: DJANGO_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: MONITORING_API_KEY
        generateValue: true
      - key: DJANGO_DB_ENGINE
        value: sqlite
