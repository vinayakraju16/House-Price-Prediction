name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check backend/api backend/djanoproject backend/model_runtime ml/data ml/features ml/training ml/evaluation ml/tests
      - name: ML tests
        run: python -m unittest discover -s ml/tests -v
      - name: Django tests and migration check
        working-directory: backend
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py test api
      - name: Django deployment checks
        working-directory: backend
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-long-random-secret-key-with-more-than-fifty-characters-123456
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_COOKIES: "true"
          DJANGO_HSTS_SECONDS: "31536000"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_HSTS_PRELOAD: "true"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_DB: house_price
          POSTGRES_USER: house_price
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U house_price -d house_price"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-backend.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-backend.txt
      - name: PostgreSQL migrations and Django tests
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py test api
        env:
          DJANGO_DB_ENGINE: postgresql
          POSTGRES_DB: house_price
          POSTGRES_USER: house_price
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_SSLMODE: disable

  containers:
    runs-on: ubuntu-latest
    needs: [python, frontend, postgres]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Validate Compose configuration
        run: docker compose config
      - name: Start application stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Browser end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop application stack
        if: always()
        run: docker compose down --volumes
